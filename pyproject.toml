[project]
name = "gangalakunta-cricket"
version = "1.0.0"
description = "Cricket Highlights, Live Scoring, Video Markers, Milestones & Archive Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic-settings==2.6.1",
    "pydantic==2.10.3",
    "httpx==0.28.0",
    "anyio==4.7.0",
    "python-dotenv==1.0.1",
    "PyJWT==2.10.1",
    "python-multipart>=0.0.18",
]

[tool.vercel]
entrypoint = "services.api.app.main:app"
