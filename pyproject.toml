[project]
name = "gangalakunta-cricket"
version = "1.0.0"
description = "Cricket Highlights, Live Scoring, Video Markers, Milestones & Archive Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.10.0",
    "python-multipart>=0.0.18",
    "langgraph>=0.2.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "services.api.app.main:app"
